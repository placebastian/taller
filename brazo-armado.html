<title>Armado del brazo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: visor 3D a la izquierda y la pagina del paso a la derecha (debajo en pantallas angostas). */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1d2430; --muted:#5d6878; --line:#d5dbe3; --accent:#d9661f; --canvas:#e3e8ee;
  --grid:#c9d1da; --aviso:#fff4e8;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181e; --panel:#1b2129; --fg:#e4e8ee; --muted:#9aa5b4; --line:#2c3440; --accent:#f08a45; --canvas:#10141a;
  --grid:#262e38; --aviso:#2a2119; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181e; --panel:#1b2129; --fg:#e4e8ee; --muted:#9aa5b4; --line:#2c3440; --accent:#f08a45;
  --canvas:#10141a; --grid:#262e38; --aviso:#2a2119; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{max-width:1400px;margin:0 auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
header h1{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.88rem}
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;height:calc(100dvh - 110px);min-height:560px}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr);height:auto;min-height:0}}
.view{position:relative;background:var(--canvas);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0}
@media (max-width:860px){.view{height:58vh;min-height:320px}}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
.pista{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);pointer-events:none}
.leyenda{position:absolute;left:10px;top:8px;display:flex;gap:10px;flex-wrap:wrap;font-size:.76rem;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:3px 8px}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:2px;flex:none;border:1px solid var(--line);display:inline-block}
.pagina{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:grid;grid-template-rows:auto 1fr auto;
  grid-template-columns:minmax(0,1fr);min-height:0;min-width:0}
.cab{padding:14px 16px 4px}
.num{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);letter-spacing:.04em}
.cab h2{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:2px 0 0;line-height:1.2;text-wrap:balance}
.cuerpo{padding:6px 16px 12px;overflow-y:auto;min-height:0}
.cuerpo ol{margin:6px 0 0;padding-left:1.3em;display:grid;gap:8px}
.cuerpo li::marker{font-family:var(--f-mono);color:var(--muted);font-size:.85em}
code{font-family:var(--f-mono);font-size:.88em;background:var(--canvas);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.aviso{margin-top:12px;background:var(--aviso);border-left:3px solid var(--accent);padding:8px 10px;border-radius:3px;font-size:.9rem}
.lista h3{font-family:var(--f-display);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  font-weight:500;margin:16px 0 6px}
.lista table{border-collapse:collapse;width:100%;font-size:.9rem}
.lista td{padding:4px 0;border-bottom:1px solid var(--line)}
.lista td.n{font-family:var(--f-mono);text-align:right;width:3.5em;font-variant-numeric:tabular-nums}
.pie{border-top:1px solid var(--line);padding:10px 16px 12px;display:grid;gap:10px}
.puntos{display:flex;flex-wrap:wrap;gap:4px}
.puntos button{width:12px;height:12px;padding:0;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer}
.puntos button.hecho{background:var(--line)}
.puntos button[aria-current="step"]{background:var(--accent);border-color:var(--accent)}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav .sig{margin-left:auto}
button.b{font:500 .9rem var(--f-body);background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:4px;
  padding:7px 12px;cursor:pointer;min-height:36px;white-space:nowrap}
button.b:hover:not(:disabled){border-color:var(--accent)}
button.b.prim{background:var(--accent);border-color:var(--accent);color:#fff}
button.b:disabled{opacity:.4;cursor:default}
button.b[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="app">
  <header>
    <h1>Armado del brazo</h1>
    <p>3 servos SG90 · tornillos M2×8 con tuerca · piezas de <code>PROYECTO_COMPLETO_U1.3mf</code></p>
  </header>
  <div class="main">
    <div class="view" id="view">
      <div class="leyenda" aria-hidden="true">
        <span><i class="sw" style="background:var(--accent)"></i>nuevo en este paso</span>
        <span><i class="sw" style="background:#c3c9d0"></i>ya armado</span>
      </div>
      <div class="pista">arrastrá para girar · rueda para acercar</div>
    </div>
    <section class="pagina" aria-live="polite">
      <div class="cab"><div class="num" id="num"></div><h2 id="titulo"></h2></div>
      <div class="cuerpo">
        <ol id="texto"></ol>
        <div class="aviso" id="aviso" hidden></div>
        <div class="lista" id="lista"></div>
      </div>
      <div class="pie">
        <div class="puntos" id="puntos" aria-label="Pasos"></div>
        <div class="nav">
          <button type="button" class="b" id="ant">← Anterior</button>
          <button type="button" class="b" id="rep" title="Ver la animación otra vez">Repetir</button>
          <button type="button" class="b" id="auto" aria-pressed="false" title="Pasa de página cada 7 segundos">Pasar solo</button>
          <button type="button" class="b prim sig" id="sig">Siguiente →</button>
        </div>
      </div>
    </section>
  </div>
</div>

}

// -------- desplazamiento de los subconjuntos (plato+torre y pinza se arman en la mesa)
function lado(g, s){
  const info = D.grupos[g];
  if (!info || PASOS[s].todo || PASOS[s].fantasma || s >= info.monta) return [0,0,0];
  return info.lado;
}
// -------- encuadre: caja de lo que importa en el paso, con los grupos ya en su lugar
function clavesEncuadre(s){
  const p = PASOS[s], todas = Object.keys(MALLAS);
  if (p.todo || p.encuadre === "todo") return todas;
  if (p.encuadre === "base+giro") return todas.filter(k => D.mallas[k].g !== "pinza");
  if (p.encuadre === "pinza+bielas") return todas.filter(k => D.mallas[k].g === "pinza").concat(["biela_motriz","biela_superior"]);
  if (Array.isArray(p.encuadre)) return p.encuadre;

}
function encuadre(s){
  const box = new THREE.Box3();
  for (const k of clavesEncuadre(s)){
    const bb = D.mallas[k].bb, o = lado(D.mallas[k].g, s);
    box.expandByPoint(new THREE.Vector3(bb[0]+o[0], bb[1]+o[1], bb[2]+o[2]));
    box.expandByPoint(new THREE.Vector3(bb[3]+o[0], bb[4]+o[1], bb[5]+o[2]));
  }
  const c = box.getCenter(new THREE.Vector3()), r = Math.max(box.getSize(new THREE.Vector3()).length()/2, 45);
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2*Math.atan(Math.tan(vf/2)*camera.aspect);
  const dist = r / Math.sin(Math.min(vf, hf)/2) * 1.2;          // un poco de aire alrededor
  const v = new THREE.Vector3(...PASOS[s].vista).normalize();
  return {objetivo:c, pos:c.clone().addScaledVector(v, dist)};
}

// -------- animacion de un paso

const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);

    if (desdeG[g].some((x, i) => Math.abs(x - hastaG[g][i]) > 0.01)) mueve = true;
  }
  const tA = (mueve && !p.todo && !reduce) ? 1.0 : 0;
  const nuevas = [];
  // el subconjunto que se monta en este paso (plato+torre, pinza) tambien va en color
  const montando = Object.keys(D.grupos).filter(g => D.grupos[g].monta === s && !p.todo);

  for (const g of Object.keys(G)){
